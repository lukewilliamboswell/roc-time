name: Set up the Python harness toolchain
description: Zig, CPython and Rust at the versions the remaining Python test harness requires, and the PDF tools the Blueprint docs environment expects. Blueprint provides none of these.

runs:
  using: composite
  steps:
    - name: Install Zig for the instrumented test host
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.17.0
        use-cache: false

    - name: Install pinned Python for generator smoke
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: benchmarks/python-version

    - name: Install pinned Rust for benchmark correctness smoke
      shell: bash
      run: |
        rust_version=$(cat benchmarks/chrono/rust-version)
        rustup toolchain install "$rust_version" --profile minimal --target x86_64-unknown-linux-musl
        echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"

    - name: Install the PDF tools the manual checks expect
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends poppler-utils
