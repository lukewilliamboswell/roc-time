name: Set up Blueprint
description: Install Nix and the pinned blueprint CLI, then realise the environment from Blueprint.lock.

# roc-automation does not publish a shared setup action yet; replace this local
# one when it does. Linux x86_64 only.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

    # Use each release's binary with that release's platform URL in Blueprint.roc.
    - name: Install blueprint 0.4.0
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/blueprint"
        curl -L --fail --retry 2 \
          https://github.com/lukewilliamboswell/roc-blueprint/releases/download/0.4.0/blueprint-x86_64-linux \
          -o "$RUNNER_TEMP/blueprint/blueprint"
        echo "3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480  $RUNNER_TEMP/blueprint/blueprint" | sha256sum --check
        chmod +x "$RUNNER_TEMP/blueprint/blueprint"
        echo "$RUNNER_TEMP/blueprint" >> "$GITHUB_PATH"

    # A step of its own, so the log shows what entering the environment costs.
    - name: Realise the environment and print the tooling compiler
      shell: bash
      run: blueprint run stable-version
