name: Extended semantic fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc-nightly
      - run: python3 scripts/fuzz.py --operation all --runs 10000000 --seconds 120 --seed 20260905
      - name: Preserve campaign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-fuzz-evidence
          path: .roc-time-tmp/fuzz/
          include-hidden-files: true
          retention-days: 14
