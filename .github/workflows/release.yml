name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 1.0.1"
        required: true
        type: string
      previous_core_url:
        description: "Explicit core archive URL for a legacy release without role metadata"
        required: false
        type: string
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Roc version
        id: roc-version
        run: echo "nightly-tag=$(< .roc-version)" >> "$GITHUB_OUTPUT"

      - name: Install Zig for the instrumented test host
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" != "branch" ]]; then
            echo "Release workflow must be run from a branch so generated docs and examples can be committed."
            exit 1
          fi

      - name: Validate package
        run: python3 scripts/all_tests.py

      - name: Resolve previous core release
        if: github.event_name == 'workflow_dispatch'
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_CORE_URL: ${{ inputs.previous_core_url }}
        run: python3 scripts/release_bundles.py previous --previous-core-url "$PREVIOUS_CORE_URL" --output .release/previous-url.txt --github-output "$GITHUB_OUTPUT"

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # The previous release may not compile with the current Roc nightly,
          # which prevents roc bump from comparing the two public APIs.
          bump_check: warn
          bump_entrypoint: package/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Bundle package
        run: python3 scripts/release_bundles.py build --output .release/bundle-manifest.json

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          bundle_glob: dist/*/*.tar.zst
          bundle_manifest_path: .release/bundle-manifest.json
          test_os_json: '["ubuntu-latest"]'

      - name: Record explicit release roles
        run: python3 scripts/release_bundles.py metadata

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
            .release/roc-time-bundles.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test exact core and zones bundle pair
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Roc version
        id: roc-version
        run: echo "nightly-tag=$(< .roc-version)" >> "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Resolve exact bundle roles
        id: pair
        run: python3 scripts/release_bundles.py paths --bundle-dir .release/test-bundles --github-output "$GITHUB_OUTPUT"

      - name: Test supplied release pair
        env:
          CORE_BUNDLE: ${{ steps.pair.outputs.core }}
          ZONE_BUNDLE: ${{ steps.pair.outputs.zones }}
        run: python3 scripts/test_bundle_examples.py --bundle-path "$CORE_BUNDLE" --zone-bundle-path "$ZONE_BUNDLE"

  publish-release:
    name: Publish GitHub release
    needs:
      - build
      - test-bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.build.outputs.docs_version }}/
          github_token: ${{ github.token }}

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}

      - name: Publish role metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: gh release upload "$RELEASE_VERSION" .release/roc-time-bundles.json --repo "$GITHUB_REPOSITORY"

  publish-docs:
    name: Publish versioned docs
    needs:
      - build
      - publish-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Roc version
        id: roc-version
        run: echo "nightly-tag=$(< .roc-version)" >> "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Resolve release URLs by role
        id: urls
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/release_bundles.py urls --github-output "$GITHUB_OUTPUT"

      - name: Update example package URLs
        env:
          CORE_URL: ${{ steps.urls.outputs.core_url }}
          ZONE_URL: ${{ steps.urls.outputs.zones_url }}
        run: python3 scripts/update_example_urls.py --bundle-url "$CORE_URL" --zone-bundle-url "$ZONE_URL"

      - name: Validate updated examples
        run: |
          for example in examples/*/main.roc; do
            roc check "$example" --no-cache
          done

      - name: Snapshot existing docs
        uses: roc-lang/release-package/actions/docs-snapshot@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          docs_root: www

      - name: Generate docs
        run: python3 scripts/docs.py "${{ needs.build.outputs.docs_version }}" --docs-root www

      - name: Update docs index
        uses: roc-lang/release-package/actions/docs-index@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          docs_root: www
          docs_version: ${{ needs.build.outputs.docs_version }}

      - name: Validate docs
        uses: roc-lang/release-package/actions/docs-validate@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          docs_root: www
          docs_version: ${{ needs.build.outputs.docs_version }}

      - name: Open release follow-up PR
        uses: roc-lang/release-package/actions/create-followup-pr@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          paths: |
            examples
            www
          branch_prefix: release-followup
          base_branch: ${{ github.ref_name }}
          commit_message: Update docs and examples for ${{ needs.build.outputs.release_version }}
          pr_title: Update docs and examples for ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
