name: Release

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Run validation only; never publish a release or deploy docs"
        type: boolean
        default: false
      release_version:
        description: "Release version, e.g. 1.0.1"
        required: false
        type: string
      previous_core_url:
        description: "Explicit previous core archive URL (legacy release or earlier prerelease)"
        required: false
        type: string
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
      candidate_version: ${{ steps.validate.outputs.release_version || 'unreleased-validation' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release branch and candidate identity
        if: github.event_name == 'workflow_dispatch' && (!inputs.nightly_validation || inputs.release_version != '')
        uses: lukewilliamboswell/roc-automation/actions/check-release@5e6663c1436f038a35cc076a1b2921983e9b954c
        with:
          version: ${{ inputs.release_version }}
          # Pilot publication comes from the supported-compiler branch.
          allow-default-branch: 'false'
          allow-nightly-bootstrap: 'false'
          compiler-root: package/main.roc
          # Explicit simulation until upstream publishes stable Roc.
          simulated-stable-pin: nightly-2026-09-05-b195f5b
          simulated-stable-line: '0.1'

      - name: Read Roc version
        id: roc-version
        run: echo "nightly-tag=$(python3 scripts/roc_version.py)" >> "$GITHUB_OUTPUT"

      - name: Install Zig for the instrumented test host
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && inputs.release_version || '' }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          github_token: ${{ github.token }}

      - name: Validate package
        run: python3 scripts/all_tests.py

      - name: Resolve previous core release
        if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_CORE_URL: ${{ inputs.previous_core_url }}
        run: python3 scripts/release_bundles.py previous --previous-core-url "$PREVIOUS_CORE_URL" --output .release/previous-url.txt --github-output "$GITHUB_OUTPUT"

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          # The previous release may not compile with the current Roc nightly,
          # which prevents roc bump from comparing the two public APIs.
          bump_check: warn
          bump_entrypoint: package/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Bundle package
        run: python3 scripts/release_bundles.py build --output .release/bundle-manifest.json

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          bundle_glob: dist/*/*.tar.zst
          bundle_manifest_path: .release/bundle-manifest.json
          test_os_json: '["ubuntu-latest"]'

      - name: Record explicit release roles
        run: python3 scripts/release_bundles.py metadata

      - name: Prepare starter kit with final role URLs
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version || 'unreleased-validation' }}
        run: python3 scripts/release_starter.py prepare --repo "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --role-metadata .release/roc-time-bundles.json --bundle-dir .release/bundles --kit-path .release/starter/roc-time-starter.zip

      - name: Upload starter kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-starter
          path: .release/starter/roc-time-starter.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload release bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
            .release/roc-time-bundles.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test exact core and zones bundle pair
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read Roc version
        id: roc-version
        run: echo "nightly-tag=$(python3 scripts/roc_version.py)" >> "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-metadata
          path: .release

      - name: Resolve exact bundle roles
        id: pair
        run: python3 scripts/release_bundles.py paths --bundle-dir .release/test-bundles --github-output "$GITHUB_OUTPUT"

      - name: Test supplied release pair
        env:
          CORE_BUNDLE: ${{ steps.pair.outputs.core }}
          ZONE_BUNDLE: ${{ steps.pair.outputs.zones }}
        run: python3 scripts/test_bundle_examples.py --bundle-path "$CORE_BUNDLE" --zone-bundle-path "$ZONE_BUNDLE"

      - name: Download starter kit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-starter
          path: .release/starter

      - name: Test supplied starter kit
        env:
          CORE_BUNDLE: ${{ steps.pair.outputs.core }}
          ZONE_BUNDLE: ${{ steps.pair.outputs.zones }}
          RELEASE_VERSION: ${{ needs.build.outputs.candidate_version }}
        run: python3 scripts/test_starter_kit.py --bundle-path "$CORE_BUNDLE" --zone-bundle-path "$ZONE_BUNDLE" --kit-path .release/starter/roc-time-starter.zip --role-metadata .release/roc-time-bundles.json --repo "$GITHUB_REPOSITORY" --release-version "$RELEASE_VERSION"

  publish-release:
    name: Publish GitHub release
    needs:
      - build
      - test-bundles
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-metadata
          path: .release

      - name: Download starter kit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-starter
          path: .release/starter

      - name: Validate starter kit before publication
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/release_starter.py validate --repo "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --role-metadata .release/roc-time-bundles.json --bundle-dir .release/bundles --kit-path .release/starter/roc-time-starter.zip

      - name: Bound API comparison diagnostics for release notes
        run: python3 scripts/release_starter.py summarize-bump --bump-output .release/bump-output.txt --summary-output .release/bump-summary.txt --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.build.outputs.docs_version }}/
          bump_output_file: .release/bump-summary.txt
          github_token: ${{ github.token }}

      - name: Add starter download and compiler instructions
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/release_starter.py notes --repo "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --role-metadata .release/roc-time-bundles.json --bundle-dir .release/bundles --kit-path .release/starter/roc-time-starter.zip --notes-path .release/release-notes.md

      - name: Disclose the compiler-support simulation
        if: github.ref == 'refs/heads/roc-0.1.x'
        run: |
          cat >> .release/release-notes.md <<'NOTE'

          This release pilots the `roc-0.1.x` support workflow with
          `nightly-2026-09-05-b195f5b` standing in for a future stable Roc compiler.
          It does not claim compatibility with an upstream stable Roc 0.1 release.
          NOTE

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}

      - name: Publish role metadata and starter kit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: gh release upload "$RELEASE_VERSION" .release/roc-time-bundles.json .release/starter/roc-time-starter.zip --repo "$GITHUB_REPOSITORY"

  publish-docs:
    needs:
      - build
      - publish-release
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
      actions: write
      statuses: write
    uses: ./.github/workflows/release-docs.yml
    with:
      release_version: ${{ needs.build.outputs.release_version }}
