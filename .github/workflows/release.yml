name: Release

# A pull request builds and tests the release under a version that is never
# published: the Roc-only gate, the examples against the working tree, then the
# exact bundles, examples archive and API docs archive, and the archived
# examples against those bundles. Dispatch from main with a version to publish
# the same files. The shared workflow owns the jobs; this repository owns its
# packages, examples, notes and Blueprint tasks.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as 0.4.0, or 0.4.0-rc1 for a release candidate; empty runs the dry run"
        type: string
        default: ""
      nightly-tag:
        description: "Exact Roc nightly for a diagnostic run; empty resolves the latest"
        type: string
        default: ""

permissions: {}

jobs:
  Release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/release-package.yml@93ca242217b1b7590554b9a12b9ac3bbfbf8bcbe
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      check-task: check
