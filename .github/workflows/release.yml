name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.2.0 or 0.2.0-rc1"
        required: true
        type: string
  # A pull request runs everything except publication, as a dry run.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-dry-run-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build and test release candidate
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the default branch for publication
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Releases are dispatched on the default branch"
          exit 1

      - uses: ./.github/actions/setup-roc-nightly

      - uses: ./.github/actions/setup-harness

      - uses: ./.github/actions/setup-blueprint

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Run the repository gate
        run: blueprint run check

      # The bundles and examples archive built here are the ones published:
      # the archive is run unchanged against these exact bundles on loopback.
      - name: Build and test the release candidate
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version || '999.999.999' }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: dist
        run: blueprint run release

      - name: Resolve the previous release
        if: github.event_name == 'workflow_dispatch'
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: blueprint run latest-release

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # The previous release may not compile with the current nightly,
          # which prevents roc bump from comparing the two public APIs.
          bump_check: warn
          bump_entrypoint: package/main.roc
          previous_url: ${{ steps.previous.outputs.core_url }}

      - name: Upload the release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate
          path: |
            dist/core/*.tar.zst
            dist/zones/*.tar.zst
            dist/roc-time-bundles.json
            dist/roc-time-examples-*.zip
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download the release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate
          path: dist

      # Upload the complete asset inventory to a draft and verify it before
      # publishing: a published release is never completed or replaced later.
      - name: Publish the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
        run: |
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" --draft --prerelease="$IS_PRERELEASE" \
            --notes-file dist/release-notes.md --generate-notes \
            dist/core/*.tar.zst dist/zones/*.tar.zst dist/roc-time-bundles.json "dist/roc-time-examples-$RELEASE_VERSION.zip"
          test "$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 4
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-docs:
    needs:
      - build
      - publish
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release-docs.yml
    with:
      release_version: ${{ needs.build.outputs.release_version }}
