name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc-nightly
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@9940bb2ed5a91d768d8195c4ce8fb460f3587b0b
        with:
          install-nix: 'true'
          cache: 'true'
          cache-workload: ci
      - run: blueprint run native-versions
      - run: blueprint run check
      - name: Preserve fuzz smoke evidence and reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-smoke-${{ runner.os }}-${{ runner.arch }}
          path: .roc-time-tmp/fuzz/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
