name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: nightly
        uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
        with:
          install-nix: 'true'
          cache: 'true'
          cache-workload: ci
      - run: blueprint run native-versions
      - run: blueprint run check
      - name: Preserve fuzz smoke evidence and reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-smoke-${{ runner.os }}-${{ runner.arch }}
          path: .roc-time-tmp/fuzz/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  fuzz-macos:
    needs: test
    if: ${{ always() && needs.test.outputs.nightly-tag != '' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
        with:
          nightly-tag: ${{ needs.test.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
        with:
          cache: 'true'
          cache-workload: fuzz
      - run: roc version
      - run: blueprint run fuzz -- --operation all --runs 100 --seconds 1 --seed 1
      - name: Preserve fuzz smoke evidence and reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-smoke-${{ runner.os }}-${{ runner.arch }}
          path: .roc-time-tmp/fuzz/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
