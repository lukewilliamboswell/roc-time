name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A new nightly can fail this job with no fault in the change under test.
  # Compare with the default branch before treating a failure as a regression.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-roc-nightly

      - uses: ./.github/actions/setup-harness

      - uses: ./.github/actions/setup-blueprint

      # Scripts run on roc-stable; the packages and examples use the nightly.
      - run: blueprint run check

      - name: Preserve fuzz smoke evidence and reproducers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-smoke-${{ runner.os }}-${{ runner.arch }}
          path: .roc-time-tmp/fuzz/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
