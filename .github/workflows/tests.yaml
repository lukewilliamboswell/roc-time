name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate the candidate compiler pin"
        type: boolean
        default: false

permissions:
  contents: read

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Read Roc version
        id: roc-version
        run: echo "nightly-tag=$(< .roc-version)" >> "$GITHUB_OUTPUT"

      - name: Install Zig for the instrumented test host
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - run: roc version

      - run: python3 scripts/all_tests.py

      - name: Preserve fuzz smoke evidence and reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-smoke-${{ runner.os }}-${{ runner.arch }}
          path: .roc-time-tmp/fuzz/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
