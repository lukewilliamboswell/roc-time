name: Release docs

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: "Existing release whose API docs should be published"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-docs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-docs:
    name: Publish versioned docs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout authored documentation and tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout released documentation sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_version }}
          path: .roc-time-tmp/release-source
          persist-credentials: false

      # API docs are generated from the package, so they use the package compiler.
      - uses: ./.github/actions/setup-roc-nightly

      - uses: ./.github/actions/setup-blueprint

      - name: Restore immutable historical API documentation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/release_docs.py fetch --allow-missing "$RELEASE_VERSION" --output .roc-time-tmp/api-docs

      - name: Require earlier release documentation history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/check_docs_history.py --repo "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --docs-root .roc-time-tmp/api-docs

      - name: Generate release API documentation
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ ! -d ".roc-time-tmp/api-docs/$RELEASE_VERSION" ]; then
            python3 scripts/docs.py "$RELEASE_VERSION" --docs-root .roc-time-tmp/api-docs --source-root .roc-time-tmp/release-source
          fi

      - name: Preserve release API documentation as an immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 scripts/release_docs.py pack "$RELEASE_VERSION" --docs-root .roc-time-tmp/api-docs --output .roc-time-tmp/docs-assets
          python3 scripts/release_docs.py publish "$RELEASE_VERSION" ".roc-time-tmp/docs-assets/roc-time-docs-$RELEASE_VERSION.tar.gz"

      # The site builder is repository tooling, so it runs on the pinned
      # compiler the Blueprint environment provides for it.
      - name: Assemble authored guides and versioned API documentation
        run: blueprint run site -- --api-root .roc-time-tmp/api-docs --output .roc-time-tmp/pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .roc-time-tmp/pages-site

  deploy-pages:
    name: Deploy versioned docs
    needs: publish-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
