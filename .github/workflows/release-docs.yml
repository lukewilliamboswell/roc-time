name: Release docs

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release whose tested native manual should be deployed; all historical API docs are restored"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-docs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-docs:
    name: Publish versioned docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout authored documentation and tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: docs

      - name: Install the PDF tools the docs environment expects
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: Restore immutable historical API documentation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/release_docs.py fetch --output .roc-time-tmp/api-docs

      - name: Require earlier release documentation history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/check_docs_history.py --repo "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --docs-root .roc-time-tmp/api-docs

      # Restore the tested manual; deployment never rebuilds a published manual.
      - name: Assemble the released native manual and versioned API documentation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: blueprint run site -- --api-root .roc-time-tmp/api-docs --output .roc-time-tmp/pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .roc-time-tmp/pages-site

  deploy-pages:
    name: Deploy versioned docs
    needs: publish-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
