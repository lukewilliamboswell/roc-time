name: Release docs

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: "Existing release whose docs and examples should be published"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-docs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-docs:
    name: Publish versioned docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout documentation history from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout trusted workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: .roc-time-tmp/workflow-source
          persist-credentials: false

      - name: Checkout released documentation sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_version }}
          path: .roc-time-tmp/release-source
          persist-credentials: false

      - name: Read Roc version
        id: roc-version
        run: |
          release_compiler=$(python3 .roc-time-tmp/workflow-source/scripts/roc_version.py --root .roc-time-tmp/release-source)
          release_authority=$(python3 .roc-time-tmp/workflow-source/scripts/roc_version.py --root .roc-time-tmp/release-source --format authority)
          echo "nightly-tag=$release_compiler" >> "$GITHUB_OUTPUT"
          echo "authority=$release_authority" >> "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Download published role metadata
        if: steps.roc-version.outputs.authority == 'header'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern roc-time-bundles.json --dir .release

      - name: Resolve release URLs by role
        if: steps.roc-version.outputs.authority == 'header'
        id: urls
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .roc-time-tmp/workflow-source/scripts/release_bundles.py urls --manifest .release/roc-time-bundles.json --github-output "$GITHUB_OUTPUT"

      - name: Bind released examples to published packages
        if: steps.roc-version.outputs.authority == 'header'
        env:
          CORE_URL: ${{ steps.urls.outputs.core_url }}
          ZONE_URL: ${{ steps.urls.outputs.zones_url }}
        run: python3 .roc-time-tmp/workflow-source/scripts/update_example_urls.py --examples-dir .roc-time-tmp/release-source/examples --bundle-url "$CORE_URL" --zone-bundle-url "$ZONE_URL" --compiler "${{ steps.roc-version.outputs.nightly-tag }}"

      - name: Validate published examples with their release compiler
        if: steps.roc-version.outputs.authority == 'header'
        run: python3 .roc-time-tmp/workflow-source/scripts/test_published_examples.py --examples-dir .roc-time-tmp/release-source/examples --expected-dir .roc-time-tmp/release-source/tests/examples

      - name: Recover missing historical docs from the release checkout
        run: |
          if [ -d .roc-time-tmp/release-source/www ]; then
            mkdir -p www
            rsync -a --ignore-existing .roc-time-tmp/release-source/www/ www/
          fi

      - name: Require earlier release documentation history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .roc-time-tmp/workflow-source/scripts/check_docs_history.py --repo "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --docs-root www

      - name: Snapshot existing docs
        uses: roc-lang/release-package/actions/docs-snapshot@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          docs_root: www

      - name: Generate docs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .roc-time-tmp/workflow-source/scripts/docs.py "$RELEASE_VERSION" --docs-root www --source-root .roc-time-tmp/release-source

      - name: Validate docs
        uses: roc-lang/release-package/actions/docs-validate@3a25de642bce84c70b0f4ab6b30ee0f730acb5cf
        with:
          docs_root: www
          docs_version: ${{ inputs.release_version }}

      - name: Promote the verified public applications
        if: steps.roc-version.outputs.authority == 'header'
        run: rsync -a --delete .roc-time-tmp/release-source/examples/ examples/

      - name: Update public release links
        if: steps.roc-version.outputs.authority == 'header'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .roc-time-tmp/workflow-source/scripts/update_release_links.py --version "$RELEASE_VERSION" --readme README.md

      - name: Open release follow-up PR
        uses: roc-lang/release-package/actions/create-followup-pr@f963105a8e6200565dcfc7c732ecf10ed2e0aee0
        with:
          release_version: ${{ inputs.release_version }}
          paths: ${{ steps.roc-version.outputs.authority == 'header' && 'www examples README.md' || 'www' }}
          branch_prefix: release-followup
          base_branch: ${{ github.event.repository.default_branch }}
          commit_message: Update docs and published examples for ${{ inputs.release_version }}
          pr_title: Update docs and published examples for ${{ inputs.release_version }}
          github_token: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: www

  deploy-pages:
    name: Deploy versioned docs
    needs: publish-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
