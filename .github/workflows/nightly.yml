name: Nightly compatibility

# Run the latest release's examples archive, unchanged, on the latest Roc
# nightly. A failure means that release no longer works for someone starting
# today, and the fix is a patch release; `main` is covered by CI.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Nightly release tag to test with; empty uses the latest"
        type: string
        default: ""
      release_tag:
        description: "Release to test; empty uses the latest full release"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the released examples
    runs-on: ubuntu-latest
    outputs:
      nightly: ${{ steps.nightly.outputs.tag }}
      release: ${{ steps.release.outputs.tag }}
      examples_url: ${{ steps.release.outputs.examples_url }}
      # Empty when a setup step failed, which says nothing about compatibility.
      outcome: ${{ steps.examples.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: nightly
        uses: ./.github/actions/setup-roc-nightly
        with:
          tag: ${{ inputs.nightly_tag }}

      - uses: ./.github/actions/setup-blueprint

      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: blueprint run latest-release

      - name: Report a release without an examples archive
        if: steps.release.outputs.examples_url == ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "::notice::Release $TAG has no examples archive, so there is nothing to test"

      - name: Download the examples archive
        if: steps.release.outputs.examples_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "roc-time-examples-$TAG.zip" --dir "$RUNNER_TEMP/release"

      # The scripts come from this checkout; the examples, their package URLs
      # and their expected output all come from the release.
      - name: Run the released examples on the nightly
        id: examples
        if: steps.release.outputs.examples_url != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: EXAMPLES_ARCHIVE="$RUNNER_TEMP/release/roc-time-examples-$TAG.zip" blueprint run examples

  # The only job that can write, and it runs no repository code.
  report:
    name: Maintain the tracking issue
    needs: test
    if: always() && (needs.test.outputs.outcome == 'success' || needs.test.outputs.outcome == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: nightly-compatibility
      OUTCOME: ${{ needs.test.outputs.outcome }}
      NIGHTLY: ${{ needs.test.outputs.nightly }}
      RELEASE: ${{ needs.test.outputs.release }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        run: |
          issue="$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')"
          if [ "$OUTCOME" = success ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Release $RELEASE passes on $NIGHTLY: $RUN_URL"
            fi
            exit 0
          fi
          message="The examples archive of release $RELEASE fails on $NIGHTLY: $RUN_URL

          The archive is immutable, so the remedy is a patch release whose packages and examples work on this nightly. This issue closes itself when the latest release passes."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$message"
          else
            gh label create "$LABEL" --color D93F0B --description "The latest release fails on the latest Roc nightly" --force
            gh issue create --label "$LABEL" --title "Latest release fails on the latest Roc nightly" --body "$message"
          fi
