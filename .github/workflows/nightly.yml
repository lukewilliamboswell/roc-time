name: Nightly compatibility

# Run the latest release's examples archive, unchanged, on the latest Roc
# nightly. A failure means that release no longer works for someone starting
# today, and the fix is a patch release; `main` is covered by the release dry
# run. The shared workflow selects one immutable release/compiler pair and owns
# execution, diagnostics and the tracking issue.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: "Exact nightly tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""
      release-tag:
        description: "Exact final release tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@9940bb2ed5a91d768d8195c4ce8fb460f3587b0b
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04"]'
